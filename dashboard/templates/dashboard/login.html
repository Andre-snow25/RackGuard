{% extends 'dashboard/base.html' %}

{% block titulo %}Entrar · RackGuard{% endblock %}

{% block conteudo %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <div class="flex flex-col items-center mb-8">
            <svg class="w-12 h-12 text-emerald-400 mb-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h3"/></svg>
            <h1 class="text-2xl font-bold text-white">RackGuard</h1>
            <p class="text-slate-400 text-sm">Monitoramento da infraestrutura das escolas</p>
        </div>

        <form method="post" class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
            {% csrf_token %}
            {% if form.errors %}
            <div class="bg-red-950 border border-red-800 text-red-300 text-sm rounded p-3">E-mail ou senha incorretos.</div>
            {% endif %}
            <div>
                <label for="id_username" class="block text-xs font-semibold uppercase text-slate-400 mb-1">E-mail</label>
                <input type="email" name="username" id="id_username" value="{{ form.username.value|default:'' }}" required autofocus autocomplete="username"
                       class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label for="id_password" class="block text-xs font-semibold uppercase text-slate-400 mb-1">Senha</label>
                <input type="password" name="password" id="id_password" required autocomplete="current-password"
                       class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 focus:outline-none focus:border-emerald-500">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded transition">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
